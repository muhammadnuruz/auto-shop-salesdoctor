[project]
name = "auto-shop-backend"
version = "0.1.0"
description = "Auto-Shop <-> Sales Doctor backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "redis>=5.0",
  "arq>=0.26",
  "structlog>=24.1",
  "orjson>=3.10",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=42",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "fakeredis[lua]>=2.23",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S311"]  # random.uniform used for retry jitter, not crypto

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "RUF001"]  # RUF001: real Cyrillic SD names

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.integrations.salesdoctor.*"
strict = true

[[tool.mypy.overrides]]
module = ["arq.*", "fakeredis.*", "openpyxl.*"]
ignore_missing_imports = true
